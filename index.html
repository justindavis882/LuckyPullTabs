<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Pull Tabs</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; perspective: 1000px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .currency-card { background: #1e293b; padding: 12px 24px; border-radius: 20px; border: 2px solid #fbbf24; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .currency-card:active { transform: scale(0.95); } /* Tactile tap */
    
    /* Pull Tab Card */
    .card { background: linear-gradient(145deg, #1e293b, #0f172a); width: 100%; max-width: 340px; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #334155; transition: transform 0.3s ease; }
    
    .card-title { text-align: center; font-size: 1.1rem; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
    
    .tabs-container { display: flex; flex-direction: column; gap: 12px; }
    .tab-row { position: relative; height: 65px; background: #020617; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 2px dashed #334155; transform-style: preserve-3d; }
    
    /* The Prize Reveal Animation */
    @keyframes prizePop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .tab-value { font-weight: 900; font-size: 1.2rem; color: #38bdf8; z-index: 1; opacity: 0; }
    .tab-value.revealed { opacity: 1; animation: prizePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .prize-text { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    
    /* The Peel Effect */
    .tab-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, #2563eb, #1d4ed8); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; border-radius: 6px; user-select: none; border-bottom: 4px solid #1e3a8a; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; transform-origin: top; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 2; }
    
    /* Active press down before peel */
    .tab-cover:active { transform: scale(0.98) translateY(2px); border-bottom-width: 2px; }
    
    /* The actual peel */
    .tab-cover.opened { transform: rotateX(90deg) scaleY(0.5); opacity: 0; pointer-events: none; }
    
    /* Tactile Buttons */
    .actions { margin-top: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
    button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); } /* Physical button press */
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-primary { background: linear-gradient(to bottom, #22c55e, #16a34a); color: white; border: 1px solid #15803d; }
    .btn-secondary { background: linear-gradient(to bottom, #fbbf24, #d97706); color: black; border: 1px solid #b45309; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎟️ Pull Tab Frenzy</h1>
    <div class="currency-card">Coins: <span id="coins">100</span> 🪙</div>
  </div>

  <div class="card">
    <div class="card-title" id="card-name">Standard Card (10 Coins)</div>
    <div class="tabs-container">
      <div class="tab-row">
        <div class="tab-value" id="val-0">???</div>
        <div class="tab-cover" onclick="openTab(0)">PULL TAB 1 🚪</div>
      </div>
      <div class="tab-row">
        <div class="tab-value" id="val-1">???</div>
        <div class="tab-cover" onclick="openTab(1)">PULL TAB 2 🚪</div>
      </div>
      <div class="tab-row">
        <div class="tab-value" id="val-2">???</div>
        <div class="tab-cover" onclick="openTab(2)">PULL TAB 3 🚪</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="new-card-btn" onclick="buyCard(10)">Buy Standard Card (10 Coins)</button>
    <button class="btn-secondary" id="prize-card-btn" onclick="buyCard(100)">Buy PRIZE Card (100 Coins)</button>
  </div>

  <!-- Prize Winner Modal -->
  <div class="modal" id="prize-modal">
    <div class="modal-content">
      <h2>🎉 YOU WON A PRIZE!</h2>
      <p>You unlocked a physical <strong>Mystery Collector Pin</strong>!</p>
      <p style="font-size: 0.85rem; color: #94a3b8;">Enter details to redeem your prize.</p>
      <button class="btn-primary" onclick="closeModal()">Claim Prize</button>
    </div>
  </div>

  <script>
    let coins = 100;
    let currentCardType = 'standard'; // 'standard' or 'prize'
    let currentRewards = [0, 0, 0];
    let openedCount = 0;

    function updateUI() {
      document.getElementById('coins').innerText = coins;
      document.getElementById('new-card-btn').disabled = coins < 10 || openedCount < 3;
      document.getElementById('prize-card-btn').disabled = coins < 100 || openedCount < 3;
    }

    function buyCard(cost) {
      if (coins < cost) return;
      coins -= cost;
      currentCardType = cost === 100 ? 'prize' : 'standard';
      openedCount = 0;

      // Generate Rewards
      if (currentCardType === 'standard') {
        document.getElementById('card-name').innerText = "Standard Card";
        currentRewards = [
          Math.floor(Math.random() * 15),
          Math.floor(Math.random() * 25),
          Math.floor(Math.random() * 10)
        ];
      } else {
        document.getElementById('card-name').innerText = "✨ PRIZE CARD ✨";
        currentRewards = [
          Math.floor(Math.random() * 50),
          "🎁 MYSTERY PRIZE!",
          Math.floor(Math.random() * 50)
        ];
      }

      // Reset Covers
      const covers = document.querySelectorAll('.tab-cover');
      covers.forEach((cover, idx) => {
        cover.classList.remove('opened');
        document.getElementById(`val-${idx}`).innerText = '???';
      });

      updateUI();
    }

    function openTab(index) {
      const cover = document.querySelectorAll('.tab-cover')[index];
      if (cover.classList.contains('opened')) return;

      cover.classList.add('opened');
      const reward = currentRewards[index];
      document.getElementById(`val-${index}`).innerText = typeof reward === 'number' ? `+${reward} Coins` : reward;

      if (typeof reward === 'number') {
        coins += reward;
      } else if (reward.includes("PRIZE")) {
        document.getElementById('prize-modal').style.display = 'flex';
      }

      openedCount++;
      updateUI();
    }

    function closeModal() {
      document.getElementById('prize-modal').style.display = 'none';
    }

    // Initialize
    buyCard(10);
  </script>

  <script type="module">
  // Import Firebase v9 Modular SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAytb8idAxIFGlSKrrfiJLqgJHmWp8BpLs",
    authDomain: "lucky-pull-tabs.firebaseapp.com",
    projectId: "lucky-pull-tabs",
    storageBucket: "lucky-pull-tabs.firebasestorage.app",
    messagingSenderId: "843069979099",
    appId: "1:843069979099:web:77a3551a85df3d3fc58ffe",
    measurementId: "G-KQ0GP1DVDS"
  };

  // Initialize App, Auth, and Database
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userId = null;

  // Listen for Auth State
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      userId = user.uid;
      console.log("Logged in as:", userId);
      await loadPlayerData();
      subscribeToPlayerUpdates();
    } else {
      // Auto-login new players anonymously
      signInAnonymously(auth).catch((error) => {
        console.error("Auth Failed:", error);
      });
    }
  });

  // Fetch initial player state
  async function loadPlayerData() {
    const playerRef = doc(db, "players", userId);
    const playerSnap = await getDoc(playerRef);

    if (playerSnap.exists()) {
      window.coins = playerSnap.data().coins;
    } else {
      // First time playing, initialize the NoSQL document
      await setDoc(playerRef, {
        coins: 100,
        inventory: [],
        lastLogin: new Date()
      });
      window.coins = 100;
    }
    window.updateUI(); // Calls your existing UI update function
  }

  // Real-time listener for database changes (prevents cheating via multiple tabs)
  function subscribeToPlayerUpdates() {
    const playerRef = doc(db, "players", userId);
    onSnapshot(playerRef, (doc) => {
      if (doc.exists()) {
        window.coins = doc.data().coins;
        window.updateUI();
      }
    });
  }
</script>
</body>
</html>
