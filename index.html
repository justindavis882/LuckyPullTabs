<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Pull Tabs</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; perspective: 1000px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .currency-card { background: #1e293b; padding: 12px 24px; border-radius: 20px; border: 2px solid #fbbf24; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .currency-card:active { transform: scale(0.95); } /* Tactile tap */
    
    /* Pull Tab Card */
    .card { background: linear-gradient(145deg, #1e293b, #0f172a); width: 100%; max-width: 340px; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #334155; transition: transform 0.3s ease; }
    
    .card-title { text-align: center; font-size: 1.1rem; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
    
    .tabs-container { display: flex; flex-direction: column; gap: 12px; }
    .tab-row { position: relative; height: 65px; background: #020617; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 2px dashed #334155; transform-style: preserve-3d; }
    
    /* The Prize Reveal Animation */
    @keyframes prizePop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .tab-value { font-weight: 900; font-size: 1.2rem; color: #38bdf8; z-index: ; opacity: 0; }
    .tab-value.revealed { opacity: 1; animation: prizePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .prize-text { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    
    /* The Peel Effect */
    .tab-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, #2563eb, #1d4ed8); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; border-radius: 6px; user-select: none; border-bottom: 4px solid #1e3a8a; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; transform-origin: top; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 2; }
    
    /* Active press down before peel */
    .tab-cover:active { transform: scale(0.98) translateY(2px); border-bottom-width: 2px; }
    
    /* The actual peel */
    .tab-cover.opened { transform: rotateX(90deg) scaleY(0.5); opacity: 0; pointer-events: none; }
    
    /* Tactile Buttons */
    .actions { margin-top: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
    button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); } /* Physical button press */
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-primary { background: linear-gradient(to bottom, #22c55e, #16a34a); color: white; border: 1px solid #15803d; }
    .btn-secondary { background: linear-gradient(to bottom, #fbbf24, #d97706); color: black; border: 1px solid #b45309; }
    /* Navigation & Small Buttons */
.top-nav { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; align-items: center; }
#user-info { font-size: 0.9rem; color: #94a3b8; font-weight: bold; }
.nav-buttons { display: flex; gap: 10px; width: 100%; }
.btn-small { padding: 8px 12px; font-size: 0.85rem; border-radius: 8px; flex: 1; }
.btn-google { background: white; color: #333; border: 1px solid #ccc; }
.btn-logout { background: #ef4444; color: white; border: 1px solid #b91c1c; }
.btn-history { background: #3b82f6; color: white; border: 1px solid #1d4ed8; }

/* History Modal Specifics */
.history-content { max-height: 80vh; display: flex; flex-direction: column; width: 90%; max-width: 400px; padding: 0; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #334155; background: #0f172a; border-radius: 16px 16px 0 0; }
.modal-header h2 { margin: 0; font-size: 1.2rem; }
.close-btn { background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 0; width: auto; box-shadow: none; }
.history-list { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.history-item { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; font-size: 0.9rem; }
.history-item .time { color: #64748b; font-size: 0.8rem; margin-bottom: 4px; display: block; }
  </style>
</head>
<body>
    
    <!-- Auth & History Controls -->
  <div class="top-nav">
    <div id="user-info">Playing Anonymously</div>
    <div class="nav-buttons">
      <button class="btn-small btn-google" id="login-btn" onclick="window.loginWithGoogle()">Sign in with Google</button>
      <button class="btn-small btn-logout" id="logout-btn" onclick="window.logout()" style="display: none;">Sign Out</button>
      <button class="btn-small btn-history" onclick="window.openHistory()">📜 History</button>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal" id="history-modal">
    <div class="modal-content history-content">
      <div class="modal-header">
        <h2>Account History</h2>
        <button class="close-btn" onclick="window.closeHistory()">✖</button>
      </div>
      <div class="history-list" id="history-list">
        <!-- History items will inject here -->
      </div>
    </div>
  </div>

  <div class="header">
    <h1>🎟️ Pull Tab Frenzy</h1>
    <div class="currency-card">Coins: <span id="coins">100</span> 🪙</div>
  </div>

  <div class="card">
    <div class="card-title" id="card-name">Standard Card (10 Coins)</div>
    <div class="tabs-container">
      <div class="tab-row">
        <div class="tab-value" id="val-0">???</div>
        <div class="tab-cover" onclick="openTab(0)">PULL TAB 1 🚪</div>
      </div>
      <div class="tab-row">
        <div class="tab-value" id="val-1">???</div>
        <div class="tab-cover" onclick="openTab(1)">PULL TAB 2 🚪</div>
      </div>
      <div class="tab-row">
        <div class="tab-value" id="val-2">???</div>
        <div class="tab-cover" onclick="openTab(2)">PULL TAB 3 🚪</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="new-card-btn" onclick="buyCard(10)">Buy Standard Card (10 Coins)</button>
    <button class="btn-secondary" id="prize-card-btn" onclick="buyCard(100)">Buy PRIZE Card (100 Coins)</button>
  </div>

  <!-- Prize Winner Modal -->
  <div class="modal" id="prize-modal">
    <div class="modal-content">
      <h2>🎉 YOU WON A PRIZE!</h2>
      <p>You unlocked a physical <strong>Mystery Collector Pin</strong>!</p>
      <p style="font-size: 0.85rem; color: #94a3b8;">Enter details to redeem your prize.</p>
      <button class="btn-primary" onclick="closeModal()">Claim Prize</button>
    </div>
  </div>

  <script>
    let coins = 100;
    let currentCardType = 'standard'; // 'standard' or 'prize'
    let currentRewards = [0, 0, 0];
    let openedCount = 0;

    function updateUI() {
      document.getElementById('coins').innerText = coins;
      document.getElementById('new-card-btn').disabled = coins < 10 || openedCount < 3;
      document.getElementById('prize-card-btn').disabled = coins < 100 || openedCount < 3;
    }

    function buyCard(cost) {
      if (coins < cost) return;
      coins -= cost;
      currentCardType = cost === 100 ? 'prize' : 'standard';
      openedCount = 0;

      // Generate Rewards
      if (currentCardType === 'standard') {
        document.getElementById('card-name').innerText = "Standard Card";
        currentRewards = [
          Math.floor(Math.random() * 15),
          Math.floor(Math.random() * 25),
          Math.floor(Math.random() * 10)
        ];
      } else {
        document.getElementById('card-name').innerText = "✨ PRIZE CARD ✨";
        currentRewards = [
          Math.floor(Math.random() * 50),
          "🎁 MYSTERY PRIZE!",
          Math.floor(Math.random() * 50)
        ];
      }

      // Reset Covers
      const covers = document.querySelectorAll('.tab-cover');
      covers.forEach((cover, idx) => {
        cover.classList.remove('opened');
        
        const valElement = document.getElementById(`val-${idx}`);
        valElement.innerText = '???';
        
        // THIS IS THE FIX: Hide the text again for the new card
        valElement.classList.remove('revealed'); 
    });

      updateUI();
    }

    function openTab(index) {
  const cover = document.querySelectorAll('.tab-cover')[index];
  if (cover.classList.contains('opened')) return;

  cover.classList.add('opened');
  const reward = currentRewards[index];
  
  // Grab the text element
  const valElement = document.getElementById(`val-${index}`);
  
  // Update the text
  valElement.innerText = typeof reward === 'number' ? `+${reward} Coins` : reward;
  
  // THIS IS THE FIX: Trigger the CSS animation to make the text visible
  valElement.classList.add('revealed'); 

  if (typeof reward === 'number') {
    // Note: If you hooked up Firebase, this is where window.logActionToDB goes!
    coins += reward; 
  } else if (reward.includes("PRIZE")) {
    document.getElementById('prize-modal').style.display = 'flex';
  }

  openedCount++;
  updateUI();
}

    function closeModal() {
      document.getElementById('prize-modal').style.display = 'none';
    }

    // Initialize
    buyCard(10);
  </script>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { 
    getAuth, 
    signInAnonymously, 
    onAuthStateChanged, 
    signInWithPopup, 
    GoogleAuthProvider, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    setDoc, 
    updateDoc, 
    onSnapshot, 
    arrayUnion 
  } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let userId = null;
  let localHistory = [];

  // --- AUTHENTICATION FLOW ---
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      userId = user.uid;
      const isAnon = user.isAnonymous;
      
      document.getElementById('user-info').innerText = isAnon ? "Playing Anonymously" : `Logged in as ${user.displayName || user.email}`;
      document.getElementById('login-btn').style.display = isAnon ? "block" : "none";
      document.getElementById('logout-btn').style.display = isAnon ? "none" : "block";

      await loadPlayerData();
      subscribeToPlayerUpdates();
    } else {
      signInAnonymously(auth).catch(console.error);
    }
  });

  window.loginWithGoogle = async () => {
    try {
      // Upgrades the anonymous session or logs into an existing account
      await signInWithPopup(auth, provider);
    } catch (error) {
      console.error("Login failed:", error);
      alert("Could not sign in with Google.");
    }
  };

  window.logout = async () => {
    await signOut(auth);
    // User drops to null, onAuthStateChanged will generate a new anonymous session
  };

  // --- FIRESTORE DATA HANDLING ---
  async function loadPlayerData() {
    const playerRef = doc(db, "players", userId);
    const playerSnap = await getDoc(playerRef);

    if (playerSnap.exists()) {
      window.coins = playerSnap.data().coins;
      localHistory = playerSnap.data().history || [];
    } else {
      await setDoc(playerRef, {
        coins: 100,
        inventory: [],
        history: [],
        lastLogin: new Date().toISOString()
      });
      window.coins = 100;
      localHistory = [];
    }
    window.updateUI();
  }

  function subscribeToPlayerUpdates() {
    const playerRef = doc(db, "players", userId);
    onSnapshot(playerRef, (docSnap) => {
      if (docSnap.exists()) {
        window.coins = docSnap.data().coins;
        localHistory = docSnap.data().history || [];
        window.updateUI();
        renderHistory(); 
      }
    });
  }

  // --- RECORDING ACTIONS TO DATABASE ---
  window.logActionToDB = async (actionDesc, cost, rewardDesc) => {
    if (!userId) return;
    const playerRef = doc(db, "players", userId);
    
    const historyEntry = {
      timestamp: new Date().toISOString(),
      action: actionDesc,
      cost: cost,
      reward: rewardDesc
    };

    // Calculate new coin balance locally before pushing to DB
    let balanceChange = typeof rewardDesc === 'number' ? rewardDesc : 0;
    let newBalance = window.coins - cost + balanceChange;

    await updateDoc(playerRef, {
      coins: newBalance,
      history: arrayUnion(historyEntry)
    });
  };

  // --- HISTORY UI ---
  window.openHistory = () => {
    renderHistory();
    document.getElementById('history-modal').style.display = 'flex';
  };

  window.closeHistory = () => {
    document.getElementById('history-modal').style.display = 'none';
  };

  function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    
    if (localHistory.length === 0) {
      list.innerHTML = "<div class='history-item'>No history yet. Pull some tabs!</div>";
      return;
    }

    // Sort newest first
    const sortedHistory = [...localHistory].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    sortedHistory.forEach(entry => {
      const date = new Date(entry.timestamp).toLocaleString();
      const item = document.createElement('div');
      item.className = 'history-item';
      
      let rewardText = typeof entry.reward === 'number' ? `+${entry.reward} Coins` : entry.reward;
      
      item.innerHTML = `
        <span class="time">${date}</span>
        <strong>${entry.action}</strong><br/>
        Cost: ${entry.cost} Coins | Result: ${rewardText}
      `;
      list.appendChild(item);
    });
  }
</script>
</body>
</html>
